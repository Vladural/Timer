<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Таймер с круговым прогрессом</title>
    <link rel="stylesheet" href="index.css" />
    <script src="index.js" defer></script>
  </head>

  <body>
    <h1>Таймер обратного отсчёта</h1>

    <label for="minutes">Введите время в минутах:</label>
    <input id="minutes" type="number" min="1" max="99" step="1" value="5" />

    <div class="timer-container">
      <svg class="timer-circle" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="circle-background" cx="100" cy="100" r="90"></circle>
        <circle
          id="progress"
          class="circle-progress"
          cx="100"
          cy="100"
          r="90"
        ></circle>
      </svg>

      <p id="timer" aria-live="off">05:00</p>
    </div>

    <div class="controls">
      <button id="startPause">Старт</button>
      <button id="reset">Сбросить</button>
      <span id="spinner" class="spinner" hidden></span>
    </div>

    <p id="message"></p>
  </body>
</html>
